<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — 2026 PPR Draft Consultant</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0d1117;
      color: #e6edf3;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    header {
      text-align: center;
      margin-bottom: 32px;
    }

    header h1 { font-size: 1.75rem; font-weight: 700; }
    header h1 span { color: #3fb950; }
    header p { margin-top: 6px; color: #8b949e; font-size: 0.9rem; }

    .card {
      width: 100%;
      max-width: 380px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 28px 28px 24px;
    }

    .card h2 { font-size: 1.1rem; font-weight: 600; margin-bottom: 20px; }

    .flash {
      background: #2d0f0f;
      border: 1px solid #da3633;
      border-radius: 6px;
      color: #f85149;
      font-size: 0.85rem;
      padding: 10px 14px;
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 0.8rem;
      color: #8b949e;
      margin-bottom: 6px;
    }

    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 10px 14px;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 8px;
      color: #e6edf3;
      font-size: 0.95rem;
      outline: none;
      margin-bottom: 16px;
      transition: border-color 0.15s;
    }

    input:focus { border-color: #3fb950; }

    button {
      width: 100%;
      padding: 11px;
      background: #238636;
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }

    button:hover { background: #2ea043; }

    .footer-link {
      text-align: center;
      margin-top: 18px;
      font-size: 0.85rem;
      color: #8b949e;
    }

    .footer-link a { color: #3fb950; text-decoration: none; }
    .footer-link a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <header>
    <h1>🏈 2026 PPR <span>Draft Consultant</span></h1>
    <p>Powered by Claude Opus 4.7 + Live Web Search</p>
  </header>

  <div class="card">
    <h2>Sign in</h2>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="flash">{{ messages[0] }}</div>
      {% endif %}
    {% endwith %}

    <form method="POST">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required autocomplete="email" />

      <label for="password">Password</label>
      <input type="password" id="password" name="password" required autocomplete="current-password" />

      <button type="submit">Sign in</button>
    </form>

    <div class="footer-link">
      Don't have an account? <a href="{{ url_for('signup') }}">Sign up</a>
    </div>
  </div>
</body>
</html>
