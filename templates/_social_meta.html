{# Link-preview metadata (Open Graph + Twitter). Included in every page's <head>.
   `social` comes from the context processor in app/__init__.py. Every shared
   link previews as the site itself: crawlers following "/" land on /login. #}
  <meta name="description" content="{{ social.description }}" />
  <link rel="canonical" href="{{ social.url }}/" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="{{ social.site_name }}" />
  <meta property="og:title" content="{{ social.title }}" />
  <meta property="og:description" content="{{ social.description }}" />
  <meta property="og:url" content="{{ social.url }}/" />
  <meta property="og:image" content="{{ social.image }}" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="{{ social.image_alt }}" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="{{ social.title }}" />
  <meta name="twitter:description" content="{{ social.description }}" />
  <meta name="twitter:image" content="{{ social.image }}" />
  <meta name="twitter:image:alt" content="{{ social.image_alt }}" />
