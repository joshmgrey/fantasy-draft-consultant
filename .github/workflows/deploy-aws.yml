# Builds the images, pushes them to ECR and deploys the CDK app in infra/.
#
# Authenticates with GitHub OIDC: no AWS keys are stored in the repo. Needs
# these repository *variables* (Settings > Secrets and variables > Actions >
# Variables), all set up in infra/README.md, "One-time bootstrap":
#
#   AWS_DEPLOY_ROLE_ARN   output DeployRoleArn of the FdcGithubOidc stack
#   AWS_REGION            e.g. us-east-1
#   DOMAIN_NAME, HOSTED_ZONE_ID, HOSTED_ZONE_NAME, CERTIFICATE_ARN  (optional)
#
# Until AWS_DEPLOY_ROLE_ARN and AWS_REGION are set the job is skipped, so
# pushes to main keep working while the app still runs on Render.
#
# Continuous delivery: runs after the CI workflow finishes on main, and only
# deploys if CI passed. workflow_run executes with this repo's permissions
# (including the OIDC deploy role) even when CI was triggered by a fork's
# pull request whose branch is named main, so the job also requires that the
# CI run came from a push to this repository or a manual CI run on main
# (workflow_dispatch needs write access). Manual runs of this workflow
# (workflow_dispatch) deploy main as-is.
name: Deploy to AWS

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write # to request the OIDC token
  contents: read

# Never run two deploys at once; queue the newer one instead of cancelling a
# CloudFormation update halfway.
concurrency:
  group: deploy-aws
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      vars.AWS_DEPLOY_ROLE_ARN != '' && vars.AWS_REGION != '' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        (github.event.workflow_run.event == 'push' ||
         github.event.workflow_run.event == 'workflow_dispatch') &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      # The commit CI tested (workflow_run), or main's tip for manual runs.
      IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: infra/package-lock.json

      - name: Install CDK dependencies
        working-directory: infra
        run: npm ci

      - name: Test the stacks
        working-directory: infra
        run: npm test

      - name: Assume the deploy role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # The repos live in their own stack so they exist before the first push.
      - name: Deploy ECR repositories
        working-directory: infra
        run: npx cdk deploy FdcEcr --require-approval never

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build and push core image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ${{ steps.ecr.outputs.registry }}/fdc/core:${{ env.IMAGE_TAG }}
            ${{ steps.ecr.outputs.registry }}/fdc/core:latest
          cache-from: type=gha,scope=core
          cache-to: type=gha,mode=max,scope=core

      - name: Build and push analysis image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: analysis_service/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ${{ steps.ecr.outputs.registry }}/fdc/analysis:${{ env.IMAGE_TAG }}
            ${{ steps.ecr.outputs.registry }}/fdc/analysis:latest
          cache-from: type=gha,scope=analysis
          cache-to: type=gha,mode=max,scope=analysis

      # Not a service: run by hand with `aws ecs run-task` (infra/README.md,
      # "Building the RAG index"). Built every time so it always embeds with
      # the same code and model as the analysis image of the same SHA.
      - name: Build and push RAG indexer image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/rag-indexer/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ${{ steps.ecr.outputs.registry }}/fdc/rag-indexer:${{ env.IMAGE_TAG }}
            ${{ steps.ecr.outputs.registry }}/fdc/rag-indexer:latest
          cache-from: type=gha,scope=rag-indexer
          cache-to: type=gha,mode=max,scope=rag-indexer

      # Waits for both ECS services to stabilize; a failing deployment trips
      # the circuit breaker, ECS rolls back, and this step fails.
      - name: Deploy app stack
        working-directory: infra
        run: >-
          npx cdk deploy FdcApp --require-approval never
          -c imageTag="$IMAGE_TAG"
          -c domainName="${{ vars.DOMAIN_NAME }}"
          -c hostedZoneId="${{ vars.HOSTED_ZONE_ID }}"
          -c hostedZoneName="${{ vars.HOSTED_ZONE_NAME }}"
          -c certificateArn="${{ vars.CERTIFICATE_ARN }}"
