# The standalone analysis service (POST/GET /v1/analyses, /healthz, /readyz).
# Verifies the core app's HMAC actor token; shares no database or models with
# core. Stateless — its audit log lives in analysis-db. Environment config
# (ANALYSIS_DATABASE_URL, ANALYSIS_TOKEN_SECRET, ANTHROPIC_API_KEY) is wired in
# a later commit from the ConfigMap and Secret.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: analysis
  labels:
    app.kubernetes.io/name: analysis
    app.kubernetes.io/component: analysis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: analysis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: analysis
        app.kubernetes.io/component: analysis
    spec:
      initContainers:
        # The service runs db.create_all() at startup; block until analysis-db
        # accepts connections so the pod starts cleanly.
        - name: wait-for-db
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - 'until pg_isready -h analysis-db -p 5432 -U analysis; do echo "waiting for analysis-db"; sleep 2; done'
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      containers:
        - name: analysis
          # Tag is pinned by the `local` overlay's images: transformer.
          image: fantasy-analysis
          ports:
            - name: http
              containerPort: 8000
          env:
            # Same shared secret the core app signs actor tokens with — must match.
            - name: ANALYSIS_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: ANALYSIS_TOKEN_SECRET
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: ANTHROPIC_API_KEY
            - name: ANALYSIS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: ANALYSIS_DB_PASSWORD
            - name: ANALYSIS_DATABASE_URL
              value: postgresql://analysis:$(ANALYSIS_DB_PASSWORD)@analysis-db:5432/analysis
          # Liveness: the gunicorn worker is up. No I/O (does not check the DB
          # or Anthropic) — a failure means the process is wedged, so restart.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # Readiness: /readyz runs "SELECT 1" against analysis-db. A failure
          # pulls this pod out of analysis-service; the core app then sees no
          # endpoint and returns its 503 "analysis service is busy" path.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
